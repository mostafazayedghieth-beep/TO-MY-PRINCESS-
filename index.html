<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise 💕</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Trebuchet MS", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #fff7fb 0%, transparent 35%),
                radial-gradient(circle at bottom right, #ffe0ed 0%, transparent 35%),
                linear-gradient(135deg, #fffafa, #ffeaf3);
            min-height: 100vh;
            color: #8f4968;
            overflow-x: hidden;
        }

        /* Floating hearts */
        .hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            color: #f5a8c5;
            font-size: 20px;
            animation: floatHeart linear infinite;
            opacity: 0.7;
        }

        .heart:nth-child(1) {
            left: 5%;
            animation-duration: 8s;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 20%;
            animation-duration: 11s;
            animation-delay: 2s;
        }

        .heart:nth-child(3) {
            left: 40%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        .heart:nth-child(4) {
            left: 60%;
            animation-duration: 12s;
            animation-delay: 3s;
        }

        .heart:nth-child(5) {
            left: 80%;
            animation-duration: 10s;
            animation-delay: 1s;
        }

        .heart:nth-child(6) {
            left: 93%;
            animation-duration: 13s;
            animation-delay: 4s;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            50% {
                transform: translateY(-50vh) rotate(20deg) scale(1.2);
            }

            100% {
                transform: translateY(-110vh) rotate(-20deg) scale(0.8);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(950px, 92%);
            margin: auto;
            padding: 45px 0 70px;
        }

        /* Header */
        .hero {
            text-align: center;
            margin-bottom: 35px;
        }

        .hero .emoji {
            font-size: 55px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .hero h1 {
            margin-top: 10px;
            font-size: clamp(35px, 7vw, 65px);
            color: #d76b98;
            text-shadow: 3px 3px 0 #fff;
        }

        .hero p {
            margin-top: 10px;
            font-size: 18px;
            color: #a96580;
        }

        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.88);
            border: 2px solid #ffd4e4;
            border-radius: 30px;
            padding: 30px;
            margin: 25px 0;
            box-shadow: 0 15px 35px rgba(210, 102, 145, 0.12);
            backdrop-filter: blur(8px);
        }

        .card h2 {
            text-align: center;
            color: #d45f8e;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: #a87389;
            margin-bottom: 25px;
        }

        /* Love Slider */
        .love-value {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            color: #df6796;
            margin: 15px;
        }

        input[type="range"] {
            width: 100%;
            height: 12px;
            appearance: none;
            border-radius: 20px;
            outline: none;
            background: linear-gradient(
                to right,
                #f28db4 0%,
                #f28db4 100%,
                #fce0eb 100%
            );
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: white;
            border: 4px solid #ed8fb4;
            box-shadow: 0 4px 10px rgba(215, 107, 152, 0.25);
        }

        input[type="range"]::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: white;
            border: 4px solid #ed8fb4;
        }

        .love-message {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            min-height: 28px;
            color: #b5577d;
            font-weight: bold;
        }

        /* Gifts */
        .gifts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .gift {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 10px;
            transition: 0.3s;
        }

        .gift:hover {
            transform: translateY(-10px) scale(1.04);
        }

        .gift-box {
            position: relative;
            width: 120px;
            height: 100px;
            margin: auto;
        }

        .box {
            position: absolute;
            bottom: 0;
            left: 5px;
            width: 110px;
            height: 75px;
            background: #f7a7c5;
            border-radius: 8px 8px 14px 14px;
            box-shadow: 0 8px 15px rgba(203, 94, 139, 0.18);
        }

        .box::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 75px;
            background: #fff0f6;
            left: 46px;
        }

        .lid {
            position: absolute;
            top: 13px;
            left: 0;
            width: 120px;
            height: 25px;
            background: #ed86ad;
            border-radius: 8px;
            transition: 0.5s;
            z-index: 2;
        }

        .lid::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 25px;
            background: #fff0f6;
            left: 51px;
        }

        .gift.opened .lid {
            transform: translateY(-35px) rotate(-8deg);
        }

        .gift-name {
            display: block;
            margin-top: 15px;
            color: #c75884;
            font-weight: bold;
        }

        /* Reveal content */
        .reveal {
            display: none;
            margin-top: 25px;
            background: #fff4f8;
            border-radius: 25px;
            padding: 25px;
            animation: reveal 0.6s ease;
        }

        .reveal.show {
            display: block;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Flowers */
        .bouquet {
            text-align: center;
            font-size: 70px;
            letter-spacing: -15px;
            margin: 10px 0 20px;
            animation: flowerFloat 3s ease-in-out infinite;
        }

        @keyframes flowerFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .flower-text {
            text-align: center;
            line-height: 1.8;
        }

        /* Music */
        .music-box {
            text-align: center;
        }

        .music-icon {
            font-size: 65px;
            animation: musicPulse 1.5s infinite;
            display: inline-block;
        }

        @keyframes musicPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        audio {
            width: 100%;
            margin-top: 20px;
            border-radius: 20px;
        }

        .music-note {
            font-size: 14px;
            color: #a7778d;
            margin-top: 12px;
        }

        /* Letter */
        .letter {
            background: #fffdf8;
            border: 2px solid #f7d8c9;
            border-radius: 18px;
            padding: 30px;
            line-height: 1.9;
            box-shadow: inset 0 0 30px rgba(232, 178, 154, 0.08);
        }

        .letter h3 {
            text-align: center;
            color: #d15e87;
            margin-bottom: 20px;
            font-size: 25px;
        }

        .letter p {
            margin-bottom: 15px;
        }

        .signature {
            text-align: right;
            color: #d25f89;
            font-weight: bold;
            margin-top: 20px;
        }

        /* Button */
        .surprise-button {
            display: block;
            margin: 30px auto 0;
            border: none;
            background: #df719d;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(210, 93, 137, 0.25);
            transition: 0.3s;
        }

        .surprise-button:hover {
            background: #cf5d8c;
            transform: translateY(-3px);
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 40px;
            color: #b57991;
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .container {
                padding-top: 25px;
            }

            .card {
                padding: 22px;
                border-radius: 24px;
            }

            .gifts {
                grid-template-columns: 1fr;
            }

            .gift-box {
                width: 130px;
                height: 105px;
            }

            .hero h1 {
                line-height: 1.1;
            }

            .letter {
                padding: 20px;
            }
        }
    </style>
</head>

        <span class="heart">♥</span>
        <span class="heart">♡</span>
        <span class="heart
